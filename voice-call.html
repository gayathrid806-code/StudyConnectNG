<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Call — StudyConnectNG</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebarMount"></div>
    <div class="app-main">
      <div id="headerMount" data-title="Voice Call"></div>
      <main class="app-content">
        <div class="voice-call-container">
          <p class="voice-call-status connecting" id="callStatus">Connecting...</p>
          <div class="voice-call-avatar" id="callAvatar">?</div>
          <h2 class="voice-call-name" id="callName">Student</h2>
          <p class="voice-call-branch" id="callBranch">Voice call in StudyConnectNG</p>
          <p class="voice-call-timer" id="callTimer">00:00</p>
          <audio id="remoteAudio" autoplay playsinline></audio>
          <div class="voice-call-controls">
            <button type="button" class="voice-call-btn mute" id="muteBtn" aria-label="Mute"></button>
            <button type="button" class="voice-call-btn end" id="endCallBtn" aria-label="End call"></button>
            <button type="button" class="voice-call-btn speaker" id="speakerBtn" aria-label="Speaker"></button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/subjects-index.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/voice-call.js"></script>
  <script>
    document.getElementById('muteBtn').innerHTML = Icons.mic;
    document.getElementById('endCallBtn').innerHTML = Icons.phoneOff;
    document.getElementById('speakerBtn').innerHTML = Icons.volume;
  </script>
</body>
</html>
