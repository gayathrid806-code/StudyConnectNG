<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — StudyConnectNG</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-panel">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo"><span id="logoIcon"></span> StudyConnectNG</a>
          <h1>Reset Password</h1>
          <p>Enter your email. Phone numbers are never used for recovery.</p>
        </div>
        <form data-validate data-auth="forgot">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@college.edu" required>
            <span class="form-error"></span>
          </div>
          <div class="auth-form-actions">
            <button type="submit" class="btn btn-primary">Send reset link</button>
          </div>
        </form>
        <div class="auth-footer"><a href="login.html">Back to log in</a></div>
      </div>
    </div>
    <div class="auth-visual">
      <div class="auth-visual-decoration"></div>
      <div class="auth-visual-decoration"></div>
      <div class="auth-visual-content">
        <h2>Stay private</h2>
        <p>Account recovery uses email only.</p>
      </div>
    </div>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/subjects-index.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>document.getElementById('logoIcon').innerHTML = Icons.logo;</script>
</body>
</html>
